# Cloud Run (e outros PaaS) injetam PORT; localmente permanece 8080.
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/ragdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  ai:
    model:
      embedding: openai
    openai:
      chat:
        enabled: false           # chat fica na Anthropic; OpenAI so para embeddings
    vectorstore:
      pgvector:
        initialize-schema: true        # cria a extensao, a tabela e o indice no primeiro start
        index-type: HNSW               # indice de busca aproximada de vizinhos
        distance-type: COSINE_DISTANCE # distancia que casa com embeddings de sentenca
        table-name: hvogel_vector_store # tabela dedicada ao manual Hvogel (evita misturar com indexacoes antigas)
    chat:
      memory:
        redis:
          host: ${SPRING_AI_CHAT_MEMORY_REDIS_HOST:localhost}
          port: ${SPRING_AI_CHAT_MEMORY_REDIS_PORT:6379}
          # URL completa (ex. rediss://default:SENHA@host:6379) — preferencial na nuvem
          url: ${SPRING_AI_CHAT_MEMORY_REDIS_URL:}
          username: ${SPRING_AI_CHAT_MEMORY_REDIS_USERNAME:}
          password: ${SPRING_AI_CHAT_MEMORY_REDIS_PASSWORD:}
          ssl: ${SPRING_AI_CHAT_MEMORY_REDIS_SSL:false}
          time-to-live: PT30M          # a conversa expira apos 30 min de inatividade

# bloco proprio do projeto (nao e do framework)
app:
  info:
    version: 1.0.0.0
    developer: Hvogel Tecnologia Ltda.
  ingest:
    auto-on-startup: true
    document: classpath:/docs/hvogel_politicas_rh.pdf
  rag:
    top-k: 6                           # manual Hvogel tem secoes mais densas (ferias, beneficios, licencas)
    similarity-threshold: 0.38         # levemente mais permissivo para termos de TI e RH combinados
  memory:
    max-messages: 20                   # tamanho da janela do MessageWindowChatMemory

# nivel DEBUG apenas para o advisor que loga prompt (IDA) e resposta (VOLTA)
logging:
  level:
    br.com.hvogel.hv_assistant.chat.PromptLoggingAdvisor: DEBUG
