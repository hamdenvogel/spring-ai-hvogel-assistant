spring:
  ai:
    model:
      chat: anthropic
      embedding: ollama        # embedding sempre no Ollama, mesmo com chat na nuvem
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5}
        max-tokens: 1024
        temperature: 0.1
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11435}
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        dimensions: 1024       # casa com o bge-m3
