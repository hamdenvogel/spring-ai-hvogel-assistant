spring:
  ai:
    model:
      chat: anthropic
      embedding: openai
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5}
        max-tokens: 1024
        temperature: 0.1
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        enabled: false
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: 1536
    vectorstore:
      pgvector:
        dimensions: 1536       # casa com text-embedding-3-small
