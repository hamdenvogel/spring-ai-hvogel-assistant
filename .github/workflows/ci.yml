name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ragdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Redis Stack (modulos usados pela memoria de conversa do Spring AI)
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      ANTHROPIC_API_KEY: test-key
      OPENAI_API_KEY: test-key
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ragdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test
      SPRING_AI_CHAT_MEMORY_REDIS_HOST: localhost
      SPRING_AI_CHAT_MEMORY_REDIS_PORT: "6379"
      SPRING_PROFILES_ACTIVE: anthropic
      MAVEN_OPTS: -Xmx1g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Enable pgvector extension
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U postgres -d ragdb -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Build and test (package)
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Show generated jar
        run: ls -lh target/*.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: hv-assistant-jar
          path: |
            target/hv-assistant-*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
